<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ app_name }} - Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            margin-right: 15px;
            cursor: pointer;
            padding: 5px;
        }

        h1 {
            color: #2e7d32;
            font-size: 1.5rem;
        }

        .upload-area {
            border: 3px dashed #43a047;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            margin: 20px 0;
            transition: background 0.2s;
        }

        .upload-area:active {
            background: #f1f8e9;
        }

        .upload-icon {
            font-size: 3rem;
            color: #43a047;
            margin-bottom: 15px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            display: none;
            border-radius: 10px;
        }

        .analyze-btn {
            background: #43a047;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            transition: background 0.2s;
        }

        .analyze-btn:active {
            background: #2e7d32;
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #43a047;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
            display: none;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .result-center {
            text-align: center;
            margin-bottom: 15px;
        }

        .result-emoji {
            font-size: 2.5rem;
        }

        .result-species {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2e7d32;
        }

        .health-badge {
            margin: 15px 0;
        }

        .health-badge span {
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
        }

        .warning-box {
            margin: 12px 0;
            padding: 12px;
            border-left: 4px solid #d97706;
            border-radius: 8px;
            background: #fffbeb;
            color: #78350f;
            line-height: 1.5;
        }

        .recommendation-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            white-space: pre-line;
        }

        .error-text {
            color: #c62828;
            text-align: center;
            margin: 15px 0;
        }

        .new-upload-btn {
            width: 100%;
            padding: 15px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .new-upload-btn:active {
            background: #2e7d32;
        }

        @media (max-width: 360px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .upload-area {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button type="button" class="back-btn" onclick="goBack()">←</button>
            <h1>Upload Image</h1>
        </div>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon">📤</div>
            <p>Tap to select an image</p>
            <p class="upload-hint">Supports JPG, PNG, GIF</p>
        </div>

        <input type="file" id="file-input" class="file-input" accept="image/*">

        <img id="preview" alt="Preview">

        <button type="button" class="analyze-btn" id="analyze-btn" disabled onclick="analyzeImage()">
            Analyze Image
        </button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Analyzing your orchid...</p>
        </div>

        <div id="result-box" class="result-box"></div>
    </div>

    <script src="/static/js/image_analysis.js?v=2"></script>
    <script>
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('result-box');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    analyzeBtn.disabled = false;
                    resultBox.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function goBack() {
            window.location.href = '/';
        }

        function analyzeImage() {
            const file = fileInput.files[0];
            if (!file) return;

            loading.style.display = 'block';
            resultBox.style.display = 'none';
            analyzeBtn.disabled = true;

            const img = new Image();
            img.onload = async function() {
                try {
                    const result = await orchidAnalyzer.analyzeImage(img);
                    loading.style.display = 'none';
                    analyzeBtn.disabled = false;
                    displayResult(result);
                } catch (error) {
                    loading.style.display = 'none';
                    analyzeBtn.disabled = false;
                    resultBox.innerHTML = `<p class="error-text">Error analyzing image: ${error.message}</p>`;
                    resultBox.style.display = 'block';
                }
            };
            img.onerror = function() {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                resultBox.innerHTML = `<p class="error-text">Error loading image for analysis</p>`;
                resultBox.style.display = 'block';
            };
            img.src = URL.createObjectURL(file);
        }

        function displayResult(data) {
            const healthStatus = (data.health_status || 'unknown').replace('_', ' ').toUpperCase();
            const healthEmoji = data.health_status === 'healthy' ? '✅' :
                data.health_status === 'not_healthy' ? '⚠️' : '❔';
            const healthColor = data.health_status === 'healthy' ? '#2e7d32' :
                data.health_status === 'not_healthy' ? '#c62828' : '#6b7280';
            const healthBackground = data.health_status === 'healthy' ? '#e8f5e9' :
                data.health_status === 'not_healthy' ? '#ffebee' : '#f3f4f6';

            resultBox.innerHTML = `
                <div class="result-title">Analysis Result</div>
                <div class="result-center">
                    <div class="result-emoji">🌸</div>
                    <div class="result-species">${data.species || 'Unknown / uncertain'}</div>
                </div>

                <div class="health-badge">
                    <span style="background: ${healthBackground}; color: ${healthColor};">
                        ${healthEmoji} ${healthStatus}
                    </span>
                </div>
                ${data.warning ? `<div class="warning-box">${data.warning}</div>` : ''}

                <div class="recommendation-box">
                    <strong>🔎 Why this result & Care Guidance:</strong><br>
                    ${data.recommendation}
                </div>

                <button type="button" class="new-upload-btn" onclick="resetUpload()">
                    📤 Upload Another Image
                </button>
            `;

            resultBox.style.display = 'block';
            analyzeBtn.style.display = 'none';
        }

        function resetUpload() {
            fileInput.value = '';
            preview.style.display = 'none';
            resultBox.style.display = 'none';
            analyzeBtn.style.display = 'block';
            analyzeBtn.disabled = true;
        }
    </script>
</body>
</html>
